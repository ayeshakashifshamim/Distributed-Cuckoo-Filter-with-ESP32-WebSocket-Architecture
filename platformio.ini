; PlatformIO Configuration for Distributed Cuckoo Filter
; master  — flash to the master ESP32 board
; slave   — flash to each slave ESP32 board
; native  — desktop unit tests (no hardware needed)

[env:master]
platform  = espressif32
board     = esp32dev
framework = arduino
; Master node (ESP32-WROVER)
upload_speed = 115200
build_flags =
    -I src
    -std=gnu++17
    -D MASTER_BUILD
build_unflags = -std=gnu++11
build_src_filter =
    +<*>
    -<slave.cpp>
monitor_speed = 115200
monitor_filters = send_on_enter

[env:slave]
platform  = espressif32
board     = esp32dev
framework = arduino
; Slave 0x01 default port
upload_speed = 115200
build_flags =
    -I src
    -std=gnu++17
    -D SLAVE_BUILD
build_unflags = -std=gnu++11
build_src_filter =
    +<*>
    -<master.cpp>
monitor_speed = 115200
monitor_filters = send_on_enter

[env:slave2]
platform  = espressif32
board     = esp32dev
framework = arduino
; Slave 0x02 fixed port and compile-time ID
build_flags =
    -I src
    -std=gnu++17
    -D SLAVE_BUILD
    -D MY_SLAVE_ID=0x02
build_unflags = -std=gnu++11
build_src_filter =
    +<*>
    -<master.cpp>
monitor_speed = 115200
monitor_filters = send_on_enter

; Desktop environment for unit tests — no ESP32 hardware needed
[env:native]
platform  = native
test_build_src = true
build_flags =
    -I src
    -std=c++17
    -D NATIVE_BUILD
build_src_filter =
    +<*>
    -<master.cpp>
    -<slave.cpp>
